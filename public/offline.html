<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>You are offline: Cognarah</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0F2C" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #0A0F2C;
        color: #ffffff;
        font: 16px/1.6 "Inter", system-ui, -apple-system, sans-serif;
      }
      .card { max-width: 30rem; width: 100%; text-align: center; }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { font-size: 1.5rem; margin: 1.25rem 0 0.5rem; letter-spacing: -0.01em; }
      p { color: #C7C9DA; margin: 0 0 1.75rem; }
      .tag { font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: #AFA9EC; }
      .actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
      a, button {
        padding: 0.6rem 1.15rem;
        border-radius: 0.5rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        border: 1px solid transparent;
      }
      .primary { background: #AFA9EC; color: #0A0F2C; }
      .secondary { background: transparent; color: #ffffff; border-color: rgba(255, 255, 255, 0.25); }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Cognarah" />
      <p class="tag">Everything AI. Nothing Else.</p>
      <h1>You are offline</h1>
      <p>Recently viewed articles are still available. Reconnect to load the latest AI news.</p>
      <div class="actions">
        <button class="primary" onclick="location.reload()">Try again</button>
        <a class="secondary" href="/">Go home</a>
      </div>
    </div>
  </body>
</html>
